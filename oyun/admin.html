<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f4d2e">
<title>Tasami Admin</title>
<style>
:root{--bg:#f2f4f1;--card:#fff;--ink:#1c2420;--mut:#6b756f;--pri:#1f6b3a;--pri2:#e3efe6;--red:#c0392b;--gold:#b8860b;--line:#e3e7e4}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1d221f;--ink:#eef2ef;--mut:#9aa59e;--pri:#5fbf7f;--pri2:#24352a;--red:#ef6b5c;--gold:#e4bd52;--line:#2c332e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.15rem;margin:0;flex:1}.pill{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 10px;font-size:.85rem}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.nav[hidden]{display:none}.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--mut)}
.nav button b{font-size:1.35rem;line-height:1.2}.nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:none;position:relative}
.dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:#aab}.dot.on{background:#2fb34f}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm{font-size:.85rem;color:var(--mut)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;background:var(--pri);color:#fff;margin-top:8px}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin:4px 0 10px;font-size:16px}
label{font-size:.85rem;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;font-size:.85rem}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.kpi b{display:block;font-size:1.5rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(100%);transition:transform .2s}
.sheet.open{transform:none}.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:30;background:#222;color:#fff;border-radius:14px;padding:12px 14px;display:none;font-size:.95rem}
.toast.err{background:var(--red)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}.stats span{font-size:.9rem}
img.ev{height:80px;border-radius:10px;margin:6px 6px 0 0;cursor:zoom-in}
#fsv{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}#fsv img{max-width:100%;max-height:100%;object-fit:contain}#fsv.z img{max-width:none;max-height:none;width:200%}#fsv b{position:fixed;top:14px;right:14px;background:#0009;color:#fff;font-size:26px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.login{max-width:420px;margin:30px auto}
</style></head><body>
