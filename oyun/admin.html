<style>
/* 2026-11-09 yeni tasarım (Taha: "çok modern ve profesyonel") — sistem yazı tipi (hız için web fontu yok) */
:root{--bg:#f4f6f5;--card:#fff;--ink:#0f1a14;--mut:#667570;--pri:#16794a;--pri-ink:#fff;--pri2:#e7f4ec;--red:#d23c2f;--red2:#fdecea;--gold:#a86b00;--gold2:#fff4dc;--blue:#2563eb;--blue2:#e8efff;--line:#e3e8e5;--sh:0 1px 2px rgba(16,32,24,.05),0 4px 16px rgba(16,32,24,.05);--sh2:0 10px 40px rgba(10,25,18,.18);--r:16px;--top:#ffffffd9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b100d;--card:#141b17;--ink:#e9efeb;--mut:#93a39a;--pri:#3fbf7f;--pri-ink:#06120b;--pri2:#16281e;--red:#f0675a;--red2:#2c1715;--gold:#e9b44c;--gold2:#2a2112;--blue:#7aa2ff;--blue2:#151d33;--line:#232d27;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 40px rgba(0,0,0,.6);--top:#0e1411d9}}
:root[data-theme="dark"]{--bg:#0b100d;--card:#141b17;--ink:#e9efeb;--mut:#93a39a;--pri:#3fbf7f;--pri-ink:#06120b;--pri2:#16281e;--red:#f0675a;--red2:#2c1715;--gold:#e9b44c;--gold2:#2a2112;--blue:#7aa2ff;--blue2:#151d33;--line:#232d27;--sh:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 40px rgba(0,0,0,.6);--top:#0e1411d9}
:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
b,strong{font-weight:650}
.top{position:sticky;top:0;z-index:6;background:var(--top);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.05rem;letter-spacing:-.01em;margin:0;flex:1;line-height:1.15}.top h1 small{display:block;font-size:.72rem;font-weight:500;color:var(--mut);letter-spacing:.02em}
.top h1 img{box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.08)}
.pill{background:var(--pri2);color:var(--pri);border-radius:99px;padding:5px 11px;font-size:.8rem;font-weight:600;white-space:nowrap}
.icB{background:var(--card);color:var(--ink);border:1px solid var(--line);width:38px;height:38px;border-radius:12px;font-size:17px;box-shadow:var(--sh);flex:none}
#rfB{margin-left:0!important;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;width:38px;height:38px;border-radius:12px!important;font-size:18px!important;box-shadow:var(--sh)}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
.nav[hidden]{display:none}.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--top);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;padding:2px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--mut)}
.nav button b{font-size:1.2rem;line-height:1;padding:6px 18px;border-radius:99px;transition:background .15s}.nav button.on{color:var(--ink);font-weight:650}.nav button.on b{background:var(--pri2)}
#rpC{color:var(--red);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line);box-shadow:var(--sh)}
.card h3,.card h2{letter-spacing:-.01em}
.card[data-p]{padding:12px 14px;margin-bottom:8px;transition:transform .12s,box-shadow .12s}.card[data-p]:active{transform:scale(.99)}
@media (hover:hover){.card[data-p]:hover{box-shadow:var(--sh2);border-color:transparent}}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--pri2),var(--card));border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex:none;position:relative}
.dot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--card);background:#a3aeb7}.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}.sm{font-size:.83rem;color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:12px;padding:13px 14px;font-weight:650;background:var(--pri);color:var(--pri-ink);margin-top:8px;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:filter .12s,transform .12s}
.btn:active{transform:scale(.985)}@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn.alt{background:var(--pri2);color:var(--pri);box-shadow:none}.btn.red{background:var(--red);color:#fff}.btn.gold{background:var(--gold2);color:var(--gold);box-shadow:inset 0 0 0 1px rgba(168,107,0,.18)}
.btn:disabled{opacity:.5}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.acts .btn{margin:0;font-size:.9rem;padding:12px 10px}
.acts #bSel,.acts #bN{background:var(--blue2);color:var(--blue);box-shadow:none}.acts #bB{background:var(--red2);color:var(--red);box-shadow:inset 0 0 0 1px rgba(210,60,47,.2)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;margin:4px 0 12px;font-size:16px;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
label{font-size:.78rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:.84rem;font-weight:500;transition:background .12s}.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--sh)}.kpi b{display:block;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.45);backdrop-filter:blur(2px);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);box-shadow:var(--sh2)}
.sheet.open{transform:none}.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}.shH{margin:0 0 12px;font-size:1.1rem;letter-spacing:-.01em}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;background:#16201b;color:#fff;border-radius:12px;padding:11px 16px;display:none;font-size:.9rem;box-shadow:var(--sh2)}
.toast.err{background:var(--red)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}.stats span{font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 10px}
.susC{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--gold2);border:1px solid rgba(168,107,0,.2);border-radius:12px;padding:10px 12px;margin:10px 0 0;font-size:.9rem}.susC .chip{margin-left:auto}.susC.ok{background:var(--pri2);border-color:transparent}
.apC{background:var(--blue2);border-radius:12px;padding:12px;margin-top:10px;font-size:.92rem}
.banPv{background:var(--red2);color:var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
img.ev{height:80px;border-radius:10px;margin:6px 6px 0 0;cursor:zoom-in}
#fsv{position:fixed;inset:0;background:#000;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:auto;touch-action:pinch-zoom}#fsv img{max-width:100%;max-height:100%;object-fit:contain}#fsv.z img{max-width:none;max-height:none;width:200%}#fsv b{position:fixed;top:14px;right:14px;background:#0009;color:#fff;font-size:26px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.login{max-width:400px;margin:8vh auto 30px;padding:24px}.login h2{font-size:1.35rem;letter-spacing:-.02em}
/* geniş ekran: sol menü, ortada içerik, pencere ortada */
@media (min-width:960px){
 .nav{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(76px + env(safe-area-inset-top)) 12px 12px;border-top:0;border-right:1px solid var(--line);z-index:5}
 .nav button{flex:none;flex-direction:row;gap:12px;padding:10px 12px;border-radius:12px;font-size:.92rem}.nav button b{padding:0;background:none!important;font-size:1.15rem}.nav button.on{background:var(--pri2);color:var(--pri)}
 @media (hover:hover){.nav button:not(.on):hover{background:var(--bg)}}
 .nav:not([hidden])~main,body:has(.nav:not([hidden])) main{margin-left:max(240px,calc(50% - 440px + 110px));padding-bottom:40px}
 .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(620px,calc(100% - 48px));border-radius:22px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .18s,opacity .18s;max-height:86vh}
 .sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.grab{display:none}
 .toast{bottom:28px}
 .top{padding-left:24px;padding-right:24px}
}
